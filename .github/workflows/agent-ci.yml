name: InfraWatch Agent CI

on:
  push:
    branches: [master, main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-agent-tests:
    name: Python Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r agent/requirements.txt

      - name: Check Python syntax
        working-directory: agent
        run: python -m compileall -q .

      - name: Run agent unit tests (no real HTTP)
        run: python -m unittest discover -s agent/tests -v
